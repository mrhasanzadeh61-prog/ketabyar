name: ketabyar
description: A personal offline library application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  sqflite: ^2.3.0
  path: ^1.8.3
  image_picker: ^1.0.4
  mobile_scanner: ^5.1.1
  shared_preferences: ^2.2.2
  intl: ^0.20.3
  path_provider: ^2.1.1
  file_picker: 13.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: assets/Vazirmatn-Regular.ttf
        - asset: assets/Vazirmatn-Bold.ttf
          weight: 700


